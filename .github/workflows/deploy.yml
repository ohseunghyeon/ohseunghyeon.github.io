name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한다. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 버전을 명시적으로 고정한다.
      # 이 고정이 없어서 2021년에 러너의 기본 Node가 14에서 16으로 올라갔을 때
      # node-sass와 sharp의 네이티브 빌드가 깨지고 4년간 배포가 멈췄다.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # URL이 하나라도 바뀌면 배포를 막는다.
      # utterances 댓글이 pathname에 걸려 있어 URL이 바뀌면 댓글이 떨어진다.
      - run: npm run verify:urls

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
